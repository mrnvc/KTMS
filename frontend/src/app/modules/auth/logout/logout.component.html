<div class="logout-card">
  <div class="logout-icon">
    <mat-icon>logout</mat-icon>
  </div>

  <h2>{{ 'AUTH.LOGOUT.TITLE' | translate }}</h2>

  <p>
    {{ 'AUTH.LOGOUT.MESSAGE' | translate }}
  </p>

  <div class="logout-actions">
    <button mat-stroked-button type="button" (click)="cancel()">
      {{ 'AUTH.LOGOUT.CANCEL_BUTTON' | translate }}
    </button>

    <button mat-raised-button color="warn" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      {{ 'AUTH.LOGOUT.CONFIRM_BUTTON' | translate }}
    </button>
  </div>
</div>
